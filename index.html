  <!-- JAVASCRIPT APP LOGIC WITH FIREBASE REALTIME CLOUD DB -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global Environment Setup
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'gastro-sync-default';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "AIzaSyDemoKeyOnlyForFallback12345",
      authDomain: "gastrosync-demo.firebaseapp.com",
      projectId: "gastrosync-demo",
      storageBucket: "gastrosync-demo.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let isInitialLoad = true;

    // Firebase Authentication & Firestore Listener
    async function initFirebase() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.warn("Auth Fallback:", err);
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        const dot = document.getElementById('sync-dot');
        const status = document.getElementById('sync-status');
        if (dot) dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
        if (status) status.innerText = "Cloud Online";

        setupOrdersListener();
      }
    });

    function getOrdersCollection() {
      return collection(db, 'artifacts', appId, 'public', 'data', 'orders');
    }

    function setupOrdersListener() {
      if (!currentUser) return;

      onSnapshot(getOrdersCollection(), (snapshot) => {
        const newOrders = [];
        snapshot.forEach((doc) => {
          newOrders.push(doc.data());
        });

        const previousOrderCount = orders.length;
        orders = newOrders;

        // Signalton abspielen, wenn im Küchen-Modus eine neue Bestellung eintrifft
        if (!isInitialLoad && orders.length > previousOrderCount) {
          playNotificationSound();
        }
        isInitialLoad = false;

        updatePendingBadge();
        if (currentRole === 'kueche') {
          renderKitchenOrders();
        }
        renderSpeisesaalHistory();
      }, (error) => {
        console.error("Firestore Listen Error:", error);
      });
    }

    // Storage Actions
    async function saveOrderToCloud(order) {
      if (!currentUser) return;
      try {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', order.id);
        await setDoc(docRef, order);
      } catch (err) {
        console.error("Error saving order:", err);
      }
    }

    async function updateOrderInCloud(order) {
      if (!currentUser) return;
      try {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', order.id);
        await setDoc(docRef, order, { merge: true });
      } catch (err) {
        console.error("Error updating order:", err);
      }
    }

    async function deleteOrderFromCloud(orderId) {
      if (!currentUser) return;
      try {
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId);
        await deleteDoc(docRef);
      } catch (err) {
        console.error("Error deleting order:", err);
      }
    }

    // App Logic State & Functions
    const MENU_ITEMS = [
      { id: 'salate', name: 'Salat', icon: 'fa-leaf' },
      { id: 'vorspeise1', name: 'Vorspeise 1', icon: 'fa-bowl-food' },
      { id: 'vorspeise2', name: 'Vorspeise 2', icon: 'fa-wheat-awn' },
      { id: 'hauptspeise1', name: 'Hauptspeise 1', icon: 'fa-drumstick-bite' },
      { id: 'hauptspeise2', name: 'Hauptspeise 2', icon: 'fa-fish' },
      { id: 'sorbet', name: 'Sorbet', icon: 'fa-ice-cream' },
      { id: 'dessert', name: 'Dessert', icon: 'fa-cake-candles' }
    ];

    let currentQuantities = {};
    let customItems = [];
    let customQtyTemp = 1;
    let orders = [];
    let currentRole = 'speisesaal';
    let kitchenFilter = 'pending';
    let soundEnabled = true;
    let pendingDeleteOrderId = null;

    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    window.unlockAudioContext = function() {
      const ctx = getAudioContext();
      playNotificationSound();
      const banner = document.getElementById('audio-unlock-banner');
      if (banner) {
        banner.classList.add('hidden');
      }
      showToast("Gong-Signal aktiviert!", "fa-volume-high");
    };

    function playNotificationSound() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(880, ctx.currentTime);
        gain1.gain.setValueAtTime(0.4, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.3);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.15);
        gain2.gain.setValueAtTime(0.5, ctx.currentTime + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.65);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(ctx.currentTime + 0.15);
        osc2.stop(ctx.currentTime + 0.65);
      } catch (err) {
        console.log('Audio error:', err);
      }
    }

    window.toggleAudio = function(manualTest = false) {
      if (manualTest && soundEnabled) {
        window.unlockAudioContext();
        return;
      }

      soundEnabled = !soundEnabled;
      const icon = document.getElementById('audio-icon');
      const btn = document.getElementById('audio-toggle-btn');

      if (soundEnabled) {
        icon.className = 'fa-solid fa-volume-high text-emerald-400';
        btn.title = "Ton aktiviert";
        showToast("Ton-Benachrichtigungen aktiviert");
        window.unlockAudioContext();
      } else {
        icon.className = 'fa-solid fa-volume-xmark text-slate-400';
        btn.title = "Ton stummgeschaltet";
        showToast("Ton stummgeschaltet", "fa-volume-xmark");
      }
    };

    window.switchRole = function(role) {
      currentRole = role;
      const viewSpeisesaal = document.getElementById('view-speisesaal');
      const viewKueche = document.getElementById('view-kueche');
      const btnSpeisesaal = document.getElementById('btn-speisesaal');
      const btnKueche = document.getElementById('btn-kueche');

      if (role === 'speisesaal') {
        viewSpeisesaal.classList.remove('hidden');
        viewKueche.classList.add('hidden');

        btnSpeisesaal.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center space-x-2 bg-amber-500 text-slate-950 shadow-md';
        btnKueche.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center space-x-2 text-slate-400 hover:text-slate-200';
      } else {
        viewSpeisesaal.classList.add('hidden');
        viewKueche.classList.remove('hidden');

        btnKueche.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center space-x-2 bg-amber-500 text-slate-950 shadow-md';
        btnSpeisesaal.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center space-x-2 text-slate-400 hover:text-slate-200';

        renderKitchenOrders();
      }
    };

    function updatePendingBadge() {
      const pendingCount = orders.filter(o => !o.seen).length;
      const badge = document.getElementById('pending-badge');
      const kitchenActiveCount = document.getElementById('kitchen-active-count');

      if (kitchenActiveCount) {
        kitchenActiveCount.innerText = `${pendingCount} Offen`;
      }

      if (badge) {
        if (pendingCount > 0) {
          badge.innerText = pendingCount;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      }
    }

    function renderMenuForm() {
      const container = document.getElementById('menu-items-container');
      if (!container) return;

      container.innerHTML = MENU_ITEMS.map(item => {
        const qty = currentQuantities[item.id] || 0;
        const activeClass = qty > 0 ? 'border-amber-500 bg-amber-500/10' : 'border-slate-700 bg-slate-950/60';

        return `
          <div class="border ${activeClass} rounded-2xl p-3 flex flex-col justify-between transition-all shadow-sm">
            <div class="flex items-center space-x-2 mb-2">
              <i class="fa-solid ${item.icon} text-amber-400 text-base"></i>
              <span class="font-bold text-sm text-slate-100 truncate">${escapeHtml(item.name)}</span>
            </div>
            <div class="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-xl overflow-hidden p-0.5">
              <button onclick="changeQty('${item.id}', -1)" class="w-9 h-9 flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white font-black text-lg rounded-lg transition-colors">-</button>
              <span id="qty-val-${item.id}" class="font-bold text-amber-400 text-base px-1">${qty}</span>
              <button onclick="changeQty('${item.id}', 1)" class="w-9 h-9 flex items-center justify-center text-slate-400 hover:bg-slate-800 hover:text-white font-black text-lg rounded-lg transition-colors">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.changeQty = function(itemId, delta) {
      currentQuantities[itemId] = Math.max(0, (currentQuantities[itemId] || 0) + delta);
      const valEl = document.getElementById(`qty-val-${itemId}`);
      if (valEl) {
        valEl.innerText = currentQuantities[itemId];
      }
      renderMenuForm();
      updateOrderSummary();
    };

    window.adjustCustomQty = function(delta) {
      customQtyTemp = Math.max(1, customQtyTemp + delta);
      const el = document.getElementById('custom-item-qty');
      if (el) el.innerText = customQtyTemp;
    };

    window.addCustomItem = function() {
      const input = document.getElementById('custom-item-input');
      const name = input ? input.value.trim() : '';

      if (!name) {
        showToast("Bitte Bezeichnung eingeben", "fa-triangle-exclamation");
        return;
      }

      customItems.push({
        id: 'custom-' + Date.now(),
        name: name,
        qty: customQtyTemp
      });

      if (input) input.value = '';
      customQtyTemp = 1;
      const el = document.getElementById('custom-item-qty');
      if (el) el.innerText = '1';

      updateOrderSummary();
      showToast(`"${name}" hinzugefügt`);
    };

    window.removeCustomItem = function(id) {
      customItems = customItems.filter(item => item.id !== id);
      updateOrderSummary();
    };

    function updateOrderSummary() {
      const summaryList = document.getElementById('order-summary-list');
      const badge = document.getElementById('summary-count-badge');
      if (!summaryList) return;

      let items = [];

      MENU_ITEMS.forEach(item => {
        const qty = currentQuantities[item.id] || 0;
        if (qty > 0) {
          items.push({ name: item.name, qty: qty, isCustom: false });
        }
      });

      customItems.forEach(ci => {
        items.push({ id: ci.id, name: ci.name, qty: ci.qty, isCustom: true });
      });

      const totalItems = items.reduce((sum, i) => sum + i.qty, 0);

      if (badge) {
        badge.innerText = `${totalItems} Artikel`;
      }

      if (items.length === 0) {
        summaryList.innerHTML = '<p class="text-slate-500 italic text-xs self-center">Noch keine Artikel ausgewählt.</p>';
        return;
      }

      summaryList.innerHTML = items.map(item => {
        if (item.isCustom) {
          return `
            <span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg flex items-center gap-1.5 font-medium text-xs">
              <strong>${item.qty}x</strong> ${escapeHtml(item.name)}
              <button onclick="removeCustomItem('${item.id}')" class="text-amber-400 hover:text-rose-400 ml-1"><i class="fa-solid fa-xmark"></i></button>
            </span>
          `;
        }
        return `
          <span class="bg-slate-900 text-slate-200 border border-slate-700 px-2.5 py-1 rounded-lg flex items-center gap-1.5 font-medium text-xs">
            <strong class="text-amber-400">${item.qty}x</strong> ${escapeHtml(item.name)}
          </span>
        `;
      }).join('');
    }

    window.resetOrderForm = function() {
      currentQuantities = {};
      customItems = [];
      const tableInput = document.getElementById('order-table-input');
      if (tableInput) tableInput.value = '';
      renderMenuForm();
      updateOrderSummary();
    };

    window.submitOrder = function() {
      let items = [];

      MENU_ITEMS.forEach(item => {
        const qty = currentQuantities[item.id] || 0;
        if (qty > 0) {
          items.push({ name: item.name, qty: qty });
        }
      });

      customItems.forEach(ci => {
        items.push({ name: ci.name, qty: ci.qty });
      });

      if (items.length === 0) {
        showToast("Bitte mindestens einen Artikel auswählen!", "fa-triangle-exclamation");
        return;
      }

      const tableInput = document.getElementById('order-table-input');
      const tableText = tableInput && tableInput.value.trim() ? tableInput.value.trim() : 'Ohne Tischangabe';

      const newOrder = {
        id: 'ord-' + Date.now(),
        table: tableText,
        items: items,
        timestamp: new Date().toISOString(),
        seen: false
      };

      saveOrderToCloud(newOrder);
      resetOrderForm();
      showToast("Bestellung an Küche gesendet!", "fa-paper-plane");
    };

    window.setKitchenFilter = function(filter) {
      kitchenFilter = filter;
      ['pending', 'completed', 'all'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (btn) {
          if (f === filter) {
            btn.className = 'px-3 py-1 rounded-lg text-xs font-bold bg-amber-500 text-slate-950';
          } else {
            btn.className = 'px-3 py-1 rounded-lg text-xs font-bold text-slate-400 hover:text-slate-200';
          }
        }
      });
      renderKitchenOrders();
    };

    window.markAsSeen = function(orderId) {
      const order = orders.find(o => o.id === orderId);
      if (order) {
        order.seen = true;
        updateOrderInCloud(order);
        showToast("Als Erledigt markiert", "fa-check");
      }
    };

    window.promptDeleteOrder = function(orderId) {
      pendingDeleteOrderId = orderId;
      const modal = document.getElementById('delete-modal');
      const confirmBtn = document.getElementById('confirm-delete-btn');
      
      if (modal && confirmBtn) {
        confirmBtn.onclick = () => {
          confirmDeleteOrder();
        };
        modal.classList.remove('hidden');
      }
    };

    window.closeDeleteModal = function() {
      pendingDeleteOrderId = null;
      const modal = document.getElementById('delete-modal');
      if (modal) {
        modal.classList.add('hidden');
      }
    };

    function confirmDeleteOrder() {
      if (!pendingDeleteOrderId) return;
      deleteOrderFromCloud(pendingDeleteOrderId);
      closeDeleteModal();
      showToast("Bestellung gelöscht", "fa-trash-can");
    }

    window.clearCompletedOrders = function() {
      const completed = orders.filter(o => o.seen);
      completed.forEach(o => deleteOrderFromCloud(o.id));
      showToast("Erledigte Bestellungen gelöscht", "fa-trash-can");
    };

    function renderKitchenOrders() {
      const container = document.getElementById('kitchen-orders-container');
      if (!container) return;

      let sortedOrders = [...orders].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

      let filtered = sortedOrders;
      if (kitchenFilter === 'pending') {
        filtered = sortedOrders.filter(o => !o.seen);
      } else if (kitchenFilter === 'completed') {
        filtered = sortedOrders.filter(o => o.seen);
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-16 text-center text-slate-500">
            <i class="fa-solid fa-bell-concierge text-4xl mb-3 block"></i>
            <p class="font-medium text-sm">Keine Bestellungen in dieser Ansicht vorhanden.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(order => {
        const timeStr = new Date(order.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const cardStyle = order.seen 
          ? 'bg-slate-800/50 border-slate-700/50 opacity-75' 
          : 'bg-slate-800 border-2 border-rose-500/80 new-order-card';

        return `
          <div class="${cardStyle} rounded-2xl p-4 flex flex-col justify-between shadow-xl transition-all">
            <div>
              <div class="flex justify-between items-start mb-3 border-b border-slate-700/60 pb-2">
                <div>
                  <h3 class="font-black text-lg text-amber-400 leading-tight">${escapeHtml(order.table)}</h3>
                  <span class="text-xs text-slate-400 font-medium">${timeStr} Uhr</span>
                </div>
                ${order.seen 
                  ? `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 text-xs px-2.5 py-1 rounded-lg font-bold"><i class="fa-solid fa-check mr-1"></i> Erledigt</span>`
                  : `<span class="bg-rose-500 text-white text-xs px-2.5 py-1 rounded-lg font-black animate-pulse">OFFEN</span>`
                }
              </div>

              <div class="space-y-2 mb-4">
                ${order.items.map(item => `
                  <div class="flex items-center justify-between bg-slate-950/80 p-2 rounded-xl border border-slate-800">
                    <span class="text-sm font-bold text-slate-100">${escapeHtml(item.name)}</span>
                    <span class="text-base font-black bg-amber-500 text-slate-950 px-2.5 py-0.5 rounded-lg">${item.qty}x</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="space-y-2">
              <div class="flex items-center gap-2">
                <button onclick="promptDeleteOrder('${order.id}')" class="p-3 bg-slate-950 hover:bg-rose-950/80 text-rose-400 hover:text-rose-300 border border-slate-700 hover:border-rose-600 rounded-xl transition-colors shadow-md flex items-center justify-center" title="Bestellung löschen">
                  <i class="fa-solid fa-trash-can text-lg"></i>
                </button>
                
                ${!order.seen ? `
                  <button onclick="markAsSeen('${order.id}')" class="flex-1 py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-sm shadow-md transition-all active:scale-95 flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-check text-lg"></i>
                    <span>Erledigt</span>
                  </button>
                ` : `
                  <div class="flex-1 text-center py-2 text-xs font-bold text-emerald-400 bg-emerald-500/10 rounded-xl border border-emerald-500/20">
                    <i class="fa-solid fa-check mr-1"></i> Erledigt
                  </div>
                `}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderSpeisesaalHistory() {
      const container = document.getElementById('speisesaal-history');
      if (!container) return;

      if (orders.length === 0) {
        container.innerHTML = '<p class="text-slate-500 italic text-xs">Noch keine Bestellungen aufgegeben.</p>';
        return;
      }

      const sortedHistory = [...orders].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      container.innerHTML = sortedHistory.slice(0, 5).map(order => {
        const timeStr = new Date(order.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const totalItems = order.items.reduce((sum, i) => sum + i.qty, 0);

        return `
          <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
            <div>
              <div class="font-bold text-slate-200 text-sm">${escapeHtml(order.table)} <span class="text-slate-500 font-normal">(${totalItems} Artikel)</span></div>
              <div class="text-[10px] text-slate-400">${timeStr} Uhr</div>
            </div>
            <div class="flex items-center space-x-2">
              ${order.seen 
                ? `<span class="text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-lg text-[11px] font-bold flex items-center gap-1"><i class="fa-solid fa-check"></i> Erledigt</span>`
                : `<span class="text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded-lg text-[11px] font-bold flex items-center gap-1"><i class="fa-solid fa-hourglass-half animate-spin"></i> In Bearbeitung</span>`
              }
              <button onclick="promptDeleteOrder('${order.id}')" class="text-slate-500 hover:text-rose-400 p-1 text-xs transition-colors" title="Löschen">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function showToast(message, iconClass = 'fa-circle-check') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      if (!toast || !toastMsg || !toastIcon) return;

      toastMsg.innerText = message;
      toastIcon.className = `fa-solid ${iconClass} text-xl`;

      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3000);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // App Startup
    initFirebase();
    renderMenuForm();
    updateOrderSummary();
  </script>
</body>
