<!DOCTYPE html>
<html lang="de" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GastroSync - Speisesaal & Küche Live System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
    /* Pulse Animation for New Orders */
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(239, 68, 68, 1); box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
      50% { border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 5px rgba(239, 68, 68, 0.1); }
    }
    .new-order-card {
      animation: pulse-border 2s infinite;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans select-none overflow-hidden bg-slate-900">

  <!-- TOP BAR / ROLE SWITCHER -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center shrink-0 shadow-lg z-10">
    <div class="flex items-center space-x-3">
      <div class="bg-amber-500 text-slate-900 p-2 rounded-xl font-black text-xl flex items-center justify-center">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight tracking-wide text-white">GastroSync</h1>
        <p class="text-xs text-slate-400">Live-Synchronisierung active</p>
      </div>
    </div>

    <!-- Mode Switch Buttons -->
    <div class="bg-slate-950 p-1.5 rounded-2xl border border-slate-800 flex space-x-1 shadow-inner">
      <button id="btn-speisesaal" onclick="switchRole('speisesaal')" class="px-5 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center space-x-2 bg-amber-500 text-slate-950 shadow-md">
        <i class="fa-solid fa-chair"></i>
        <span>Speisesaal</span>
      </button>
      <button id="btn-kueche" onclick="switchRole('kueche')" class="px-5 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center space-x-2 text-slate-400 hover:text-slate-200">
        <i class="fa-solid fa-fire-burner"></i>
        <span>Küche</span>
        <span id="pending-badge" class="hidden bg-rose-500 text-white text-xs font-black px-2 py-0.5 rounded-full ml-1">0</span>
      </button>
    </div>

    <!-- Status & Sound Toggle -->
    <div class="flex items-center space-x-2">
      <button id="audio-toggle-btn" onclick="toggleAudio()" class="p-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-slate-300 transition-colors relative" title="Ton-Benachrichtigung umschalten">
        <i id="audio-icon" class="fa-solid fa-volume-high text-emerald-400"></i>
      </button>
      <div class="hidden sm:flex items-center space-x-2 bg-slate-950/50 px-3 py-1.5 rounded-xl border border-slate-800 text-xs text-slate-400">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="sync-status">Verbunden</span>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="flex-1 relative overflow-hidden bg-slate-900">

    <!-- SPEISESAAL VIEW -->
    <section id="view-speisesaal" class="h-full flex flex-col lg:flex-row overflow-y-auto lg:overflow-hidden p-4 gap-4">
      
      <!-- Left side: Menu items selection grid (Garantierte Mindesthöhe & fester Bereich) -->
      <div class="flex-1 flex flex-col min-h-[420px] lg:h-full bg-slate-800/60 rounded-2xl border border-slate-700/60 backdrop-blur-sm p-4 shadow-xl overflow-hidden shrink-0">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700 shrink-0">
          <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">
            <i class="fa-solid fa-utensils"></i> Speisen auswählen
          </h2>
          <button onclick="resetOrderForm()" class="text-xs text-slate-400 hover:text-rose-400 flex items-center gap-1 transition-colors px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-700">
            <i class="fa-solid fa-rotate-left"></i> Zurücksetzen
          </button>
        </div>

        <!-- Scrollable items grid (KACHELN - mit garantierter minimaler Höhe) -->
        <div class="flex-1 overflow-y-auto pr-1 grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3 auto-rows-max min-h-[260px]" id="menu-items-container">
          <!-- Standard Menu Tiles will be inserted here dynamically -->
        </div>

        <!-- Custom Item Input (Fixed Footer) -->
        <div class="mt-4 pt-3 border-t border-slate-700 shrink-0">
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Benutzerdefinierter Artikel / Extra</label>
          <div class="flex gap-2">
            <input type="text" id="custom-item-name" placeholder="z. B. Sonderwunsch, Extrabrot..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500">
            <div class="flex items-center bg-slate-900 rounded-xl border border-slate-700 px-1">
              <button onclick="adjustCustomQty(-1)" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white font-bold text-lg rounded-lg hover:bg-slate-800">-</button>
              <input type="number" id="custom-item-qty" value="1" min="1" class="w-10 text-center bg-transparent text-amber-400 font-bold text-sm focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
              <button onclick="adjustCustomQty(1)" class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-white font-bold text-lg rounded-lg hover:bg-slate-800">+</button>
            </div>
            <button onclick="addCustomItem()" class="bg-slate-700 hover:bg-slate-600 text-amber-400 px-4 py-2 rounded-xl text-sm font-bold transition-colors flex items-center gap-1">
              <i class="fa-solid fa-plus"></i> Hinzufügen
            </button>
          </div>
          <!-- Custom items list preview -->
          <div id="custom-items-list" class="flex flex-wrap gap-2 mt-2 max-h-20 overflow-y-auto"></div>
        </div>
      </div>

      <!-- Right side: Order Summary & Confirmation -->
      <div class="w-full lg:w-96 flex flex-col min-h-0 lg:h-full bg-slate-800/80 rounded-2xl border border-slate-700/60 backdrop-blur-sm p-4 shadow-xl shrink-0">
        <h2 class="text-xl font-bold text-amber-400 mb-3 pb-2 border-b border-slate-700 flex items-center gap-2 shrink-0">
          <i class="fa-solid fa-receipt"></i> Bestellübersicht
        </h2>

        <!-- Tisch/Hinweis Angabe -->
        <div class="mb-4 shrink-0">
          <label class="block text-xs font-semibold text-slate-400 mb-1">Tisch-Nr. / Info (Optional)</label>
          <input type="text" id="table-number" placeholder="z. B. Tisch 4, Extrawunsch..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 font-medium">
        </div>

        <!-- Selected Items Review -->
        <div class="flex-1 overflow-y-auto min-h-[100px] max-h-[200px] lg:max-h-none bg-slate-900/60 rounded-xl p-3 border border-slate-800 space-y-2" id="order-summary-list">
          <div class="text-center text-slate-500 py-8 text-sm italic">
            Noch keine Artikel ausgewählt.<br>Wählen Sie oben Mengen aus.
          </div>
        </div>

        <!-- Submit Order Button -->
        <div class="mt-4 pt-2 shrink-0">
          <button id="submit-order-btn" onclick="submitOrder()" disabled class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed text-white font-black text-lg rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center gap-2">
            <i class="fa-solid fa-paper-plane"></i>
            <span>Bestellung abschicken</span>
          </button>
        </div>

        <!-- Recent Submitted Orders Collapsible -->
        <div class="mt-4 border-t border-slate-700/60 pt-3 shrink-0 flex flex-col min-h-0">
          <div class="flex justify-between items-center text-xs font-semibold text-slate-400 mb-2">
            <span>Letzte Bestellungen</span>
            <span id="my-orders-count" class="bg-slate-700 px-2 py-0.5 rounded-full text-slate-300">0</span>
          </div>
          <div id="speisesaal-history" class="max-h-32 lg:max-h-40 overflow-y-auto space-y-2 pr-1 text-xs">
            <!-- Order status cards will show up here -->
          </div>
        </div>

      </div>
    </section>

    <!-- KÜCHE VIEW -->
    <section id="view-kueche" class="h-full flex flex-col overflow-hidden p-4 hidden">
      
      <!-- Filter and Control Header -->
      <div class="bg-slate-800/80 backdrop-blur border border-slate-700/60 rounded-2xl p-3 mb-4 flex flex-wrap gap-3 items-center justify-between shadow-lg">
        <div class="flex items-center space-x-2">
          <span class="text-amber-400 font-bold text-lg flex items-center gap-2">
            <i class="fa-solid fa-fire"></i> Küchenansicht
          </span>
          <span id="kitchen-active-count" class="bg-rose-500 text-white text-xs font-extrabold px-2.5 py-1 rounded-full">
            0 Offen
          </span>
        </div>

        <!-- Filter Buttons -->
        <div class="flex items-center space-x-2 bg-slate-900 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
          <button id="filter-all" onclick="setKitchenFilter('all')" class="px-3 py-1.5 rounded-lg text-slate-400 transition-colors">Alle</button>
          <button id="filter-pending" onclick="setKitchenFilter('pending')" class="px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold transition-colors">Offen</button>
          <button id="filter-completed" onclick="setKitchenFilter('completed')" class="px-3 py-1.5 rounded-lg text-slate-400 transition-colors">Erledigt</button>
        </div>

        <!-- Actions -->
        <div class="flex items-center space-x-2">
          <button onclick="clearCompletedOrders()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-xl transition-colors flex items-center gap-1.5">
            <i class="fa-solid fa-trash-can"></i> Erledigte löschen
          </button>
        </div>
      </div>

      <!-- Orders Live Grid -->
      <div id="kitchen-orders-container" class="flex-1 overflow-y-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 pb-12">
        <!-- Live order cards will be populated here -->
      </div>
    </section>

  </main>

  <!-- TOAST / NOTIFICATION POPUP -->
  <div id="toast" class="fixed bottom-6 right-6 bg-emerald-500 text-slate-950 font-bold px-5 py-3 rounded-2xl shadow-2xl transition-all transform translate-y-24 opacity-0 flex items-center space-x-3 z-50">
    <i id="toast-icon" class="fa-solid fa-circle-check text-xl"></i>
    <span id="toast-message">Bestellung gesendet!</span>
  </div>

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    // --- Application State ---
    const MENU_ITEMS = [
      { id: 'salate', name: 'Salat', icon: 'fa-leaf' },
      { id: 'vorspeise1', name: 'Vorspeise 1', icon: 'fa-bowl-food' },
      { id: 'vorspeise2', name: 'Vorspeise 2', icon: 'fa-wheat-awn' },
      { id: 'hauptspeise1', name: 'Hauptspeise 1', icon: 'fa-drumstick-bite' },
      { id: 'hauptspeise2', name: 'Hauptspeise 2', icon: 'fa-fish' },
      { id: 'sorbet', name: 'Sorbet', icon: 'fa-ice-cream' },
      { id: 'dessert', name: 'Dessert', icon: 'fa-cake-candles' }
    ];

    let currentQuantities = {};
    let customItems = [];
    let orders = [];
    let currentRole = 'speisesaal';
    let kitchenFilter = 'pending';
    let soundEnabled = true;

    // Synchronisation via BroadcastChannel & LocalStorage
    const SYNC_CHANNEL = 'gastrosync_orders_channel';
    const LOCAL_STORAGE_KEY = 'gastrosync_orders_data';
    let bc;

    try {
      bc = new BroadcastChannel(SYNC_CHANNEL);
      bc.onmessage = (event) => {
        if (event.data && event.data.type === 'ORDERS_UPDATED') {
          loadOrdersFromStorage();
          if (currentRole === 'kueche' && event.data.isNewOrder) {
            playNotificationSound();
          }
        }
      };
    } catch (e) {
      console.warn("BroadcastChannel nicht unterstützt, verwende nur localStorage fallback.");
    }

    // Storage Event Listener für Cross-Tab Fallback
    window.addEventListener('storage', (e) => {
      if (e.key === LOCAL_STORAGE_KEY) {
        loadOrdersFromStorage();
      }
    });

    // Web Audio API für Küchen-Signalton
    function playNotificationSound() {
      if (!soundEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15); // A5
        
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (err) {
        console.log('Audio konnte nicht abgespielt werden', err);
      }
    }

    function toggleAudio() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('audio-icon');
      const btn = document.getElementById('audio-toggle-btn');

      if (soundEnabled) {
        icon.className = 'fa-solid fa-volume-high text-emerald-400';
        btn.title = "Ton aktiviert";
        showToast("Ton-Benachrichtigungen aktiviert");
      } else {
        icon.className = 'fa-solid fa-volume-xmark text-slate-400';
        btn.title = "Ton stummgeschaltet";
        showToast("Ton stummgeschaltet", "fa-volume-xmark");
      }
    }

    // Rollenwechsel (Speisesaal / Küche)
    function switchRole(role) {
      currentRole = role;
      const viewSpeisesaal = document.getElementById('view-speisesaal');
      const viewKueche = document.getElementById('view-kueche');
      const btnSpeisesaal = document.getElementById('btn-speisesaal');
      const btnKueche = document.getElementById('btn-kueche');

      if (role === 'speisesaal') {
        viewSpeisesaal.classList.remove('hidden');
        viewKueche.classList.add('hidden');

        btnSpeisesaal.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center space-x-2 bg-amber-500 text-slate-950 shadow-md';
        btnKueche.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center space-x-2 text-slate-400 hover:text-slate-200';
      } else {
        viewSpeisesaal.classList.add('hidden');
        viewKueche.classList.remove('hidden');

        btnKueche.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center space-x-2 bg-amber-500 text-slate-950 shadow-md';
        btnSpeisesaal.className = 'px-5 py-2.5 rounded-xl font-bold text-sm transition-all flex items-center space-x-2 text-slate-400 hover:text-slate-200';

        renderKitchenOrders();
      }
    }

    // Data Load & Save
    function loadOrdersFromStorage() {
      const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (stored) {
        try {
          orders = JSON.parse(stored);
        } catch (e) {
          orders = [];
        }
      }
      updatePendingBadge();
      if (currentRole === 'kueche') {
        renderKitchenOrders();
      }
      renderSpeisesaalHistory();
    }

    function saveOrdersAndNotify(isNewOrder = false) {
      localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(orders));
      if (bc) {
        bc.postMessage({ type: 'ORDERS_UPDATED', isNewOrder });
      }
      updatePendingBadge();
      if (currentRole === 'kueche') {
        renderKitchenOrders();
      }
      renderSpeisesaalHistory();
    }

    function updatePendingBadge() {
      const pendingCount = orders.filter(o => !o.seen).length;
      const badge = document.getElementById('pending-badge');
      const kitchenActiveCount = document.getElementById('kitchen-active-count');

      if (kitchenActiveCount) {
        kitchenActiveCount.innerText = `${pendingCount} Offen`;
      }

      if (pendingCount > 0) {
        badge.innerText = pendingCount;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // --- Speisesaal Logic (Kacheln Render) ---
    function renderMenuForm() {
      const container = document.getElementById('menu-items-container');
      
      // Falls Kacheln noch nicht erzeugt wurden, einmalig erzeugen
      if (!container.hasChildNodes() || container.children.length !== MENU_ITEMS.length) {
        container.innerHTML = MENU_ITEMS.map(item => {
          return `
            <div id="tile-${item.id}" class="flex flex-col justify-between p-4 rounded-2xl border-2 border-slate-700/80 bg-slate-900/90 transition-all shadow-md">
              <div class="flex items-center space-x-3 mb-3">
                <div id="tile-icon-${item.id}" class="w-12 h-12 rounded-xl bg-slate-800 text-amber-400 flex items-center justify-center text-xl font-bold transition-colors shadow-inner shrink-0">
                  <i class="fa-solid ${item.icon}"></i>
                </div>
                <span class="font-extrabold text-slate-100 text-lg leading-tight">${item.name}</span>
              </div>

              <!-- Quantity Control Buttons -->
              <div class="flex items-center justify-between bg-slate-950/80 p-1.5 rounded-xl border border-slate-800">
                <button onclick="changeQty('${item.id}', -1)" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-amber-400 active:scale-95 font-black text-2xl rounded-lg border border-slate-700/80 transition-all flex items-center justify-center shadow-md">
                  <i class="fa-solid fa-minus"></i>
                </button>
                
                <input type="number" min="0" id="input-${item.id}" value="0" 
                       onchange="setQty('${item.id}', this.value)"
                       class="w-16 text-center bg-transparent text-amber-400 font-black text-2xl focus:outline-none [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                
                <button onclick="changeQty('${item.id}', 1)" class="w-12 h-12 bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-amber-400 active:scale-95 font-black text-2xl rounded-lg border border-slate-700/80 transition-all flex items-center justify-center shadow-md">
                  <i class="fa-solid fa-plus"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      // Werte und Styling im bestehenden DOM aktualisieren (kein Neuzeichnen/Verschwinden mehr)
      MENU_ITEMS.forEach(item => {
        const qty = currentQuantities[item.id] || 0;
        const tile = document.getElementById(`tile-${item.id}`);
        const icon = document.getElementById(`tile-icon-${item.id}`);
        const input = document.getElementById(`input-${item.id}`);

        if (input && input !== document.activeElement) {
          input.value = qty;
        }

        if (tile && icon) {
          if (qty > 0) {
            tile.className = 'flex flex-col justify-between p-4 rounded-2xl border-2 border-amber-500 bg-slate-800 transition-all shadow-md';
            icon.className = 'w-12 h-12 rounded-xl bg-amber-500 text-slate-950 flex items-center justify-center text-xl font-bold transition-colors shadow-inner shrink-0';
          } else {
            tile.className = 'flex flex-col justify-between p-4 rounded-2xl border-2 border-slate-700/80 bg-slate-900/90 transition-all shadow-md';
            icon.className = 'w-12 h-12 rounded-xl bg-slate-800 text-amber-400 flex items-center justify-center text-xl font-bold transition-colors shadow-inner shrink-0';
          }
        }
      });
    }

    function changeQty(id, delta) {
      currentQuantities[id] = Math.max(0, (currentQuantities[id] || 0) + delta);
      renderMenuForm();
      updateOrderSummary();
    }

    function setQty(id, value) {
      const parsed = parseInt(value) || 0;
      currentQuantities[id] = Math.max(0, parsed);
      renderMenuForm();
      updateOrderSummary();
    }

    function adjustCustomQty(delta) {
      const qtyInput = document.getElementById('custom-item-qty');
      const current = parseInt(qtyInput.value) || 1;
      qtyInput.value = Math.max(1, current + delta);
    }

    function addCustomItem() {
      const nameInput = document.getElementById('custom-item-name');
      const qtyInput = document.getElementById('custom-item-qty');

      const name = nameInput.value.trim();
      const qty = parseInt(qtyInput.value) || 1;

      if (!name) return;

      customItems.push({ id: 'custom_' + Date.now(), name: name, qty: qty });
      nameInput.value = '';
      qtyInput.value = '1';

      renderCustomItemsList();
      updateOrderSummary();
    }

    function removeCustomItem(id) {
      customItems = customItems.filter(item => item.id !== id);
      renderCustomItemsList();
      updateOrderSummary();
    }

    function renderCustomItemsList() {
      const container = document.getElementById('custom-items-list');
      container.innerHTML = customItems.map(item => `
        <span class="inline-flex items-center gap-1.5 bg-amber-500/10 border border-amber-500/30 text-amber-400 px-2.5 py-1 rounded-lg text-xs font-semibold">
          ${escapeHtml(item.name)} (${item.qty}x)
          <button onclick="removeCustomItem('${item.id}')" class="hover:text-rose-400 ml-1 font-bold">&times;</button>
        </span>
      `).join('');
    }

    function updateOrderSummary() {
      const summaryList = document.getElementById('order-summary-list');
      const submitBtn = document.getElementById('submit-order-btn');

      const itemsToSubmit = [];

      MENU_ITEMS.forEach(item => {
        const qty = currentQuantities[item.id] || 0;
        if (qty > 0) {
          itemsToSubmit.push({ name: item.name, qty: qty });
        }
      });

      customItems.forEach(item => {
        itemsToSubmit.push({ name: item.name, qty: item.qty });
      });

      if (itemsToSubmit.length === 0) {
        summaryList.innerHTML = `
          <div class="text-center text-slate-500 py-8 text-sm italic">
            Noch keine Artikel ausgewählt.<br>Wählen Sie oben Mengen aus.
          </div>`;
        submitBtn.disabled = true;
        return;
      }

      submitBtn.disabled = false;
      summaryList.innerHTML = itemsToSubmit.map(item => `
        <div class="flex justify-between items-center bg-slate-950/60 p-2 rounded-lg border border-slate-800 text-sm">
          <span class="text-slate-200 font-medium">${escapeHtml(item.name)}</span>
          <span class="bg-amber-500/20 text-amber-400 font-bold px-2 py-0.5 rounded text-xs">${item.qty}x</span>
        </div>
      `).join('');
    }

    function resetOrderForm() {
      currentQuantities = {};
      customItems = [];
      document.getElementById('table-number').value = '';
      document.getElementById('custom-item-name').value = '';
      document.getElementById('custom-item-qty').value = '1';
      renderMenuForm();
      renderCustomItemsList();
      updateOrderSummary();
    }

    function submitOrder() {
      const itemsToSubmit = [];

      MENU_ITEMS.forEach(item => {
        const qty = currentQuantities[item.id] || 0;
        if (qty > 0) {
          itemsToSubmit.push({ name: item.name, qty: qty });
        }
      });

      customItems.forEach(item => {
        itemsToSubmit.push({ name: item.name, qty: item.qty });
      });

      if (itemsToSubmit.length === 0) return;

      const tableInput = document.getElementById('table-number').value.trim();
      const tableName = tableInput ? tableInput : `Bestellung #${orders.length + 1}`;

      const newOrder = {
        id: 'ord_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
        table: tableName,
        items: itemsToSubmit,
        timestamp: new Date().toISOString(),
        seen: false
      };

      orders.unshift(newOrder);
      saveOrdersAndNotify(true);
      resetOrderForm();
      showToast('Bestellung an Küche gesendet!');
    }

    // --- Kitchen Orders Render ("Erledigt" Status & Button) ---
    function setKitchenFilter(filter) {
      kitchenFilter = filter;
      document.getElementById('filter-all').className = filter === 'all' ? 'px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold transition-colors' : 'px-3 py-1.5 rounded-lg text-slate-400 transition-colors';
      document.getElementById('filter-pending').className = filter === 'pending' ? 'px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold transition-colors' : 'px-3 py-1.5 rounded-lg text-slate-400 transition-colors';
      document.getElementById('filter-completed').className = filter === 'completed' ? 'px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold transition-colors' : 'px-3 py-1.5 rounded-lg text-slate-400 transition-colors';
      renderKitchenOrders();
    }

    function toggleOrderSeen(orderId) {
      const order = orders.find(o => o.id === orderId);
      if (order) {
        order.seen = !order.seen;
        saveOrdersAndNotify(false);
      }
    }

    function clearCompletedOrders() {
      const completedCount = orders.filter(o => o.seen).length;
      if (completedCount === 0) {
        showToast('Keine erledigten Bestellungen zum Löschen vorhanden.', 'fa-circle-info');
        return;
      }

      orders = orders.filter(o => !o.seen);
      saveOrdersAndNotify(false);
      showToast(`${completedCount} erledigte Bestellung(en) gelöscht.`);
    }

    function renderKitchenOrders() {
      const container = document.getElementById('kitchen-orders-container');

      // Sortierung: Älteste Bestellungen (Zuerst eingegeben) ganz oben anzeigen
      let sortedOrders = [...orders].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

      let filtered = sortedOrders;
      if (kitchenFilter === 'pending') {
        filtered = sortedOrders.filter(o => !o.seen);
      } else if (kitchenFilter === 'completed') {
        filtered = sortedOrders.filter(o => o.seen);
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full flex flex-col items-center justify-center py-16 text-slate-500">
            <i class="fa-solid fa-utensils text-5xl mb-3 opacity-30"></i>
            <p class="text-lg font-medium">Keine Bestellungen vorhanden</p>
            <p class="text-xs text-slate-600 mt-1">Neue Bestellungen erscheinen hier in Echtzeit</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(order => {
        const timeStr = new Date(order.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const isSeen = order.seen;

        return `
          <div class="bg-slate-800 border-2 ${isSeen ? 'border-slate-700/60 opacity-70' : 'border-rose-500/80 new-order-card'} rounded-2xl p-4 shadow-xl flex flex-col justify-between transition-all">
            <div>
              <!-- Header -->
              <div class="flex justify-between items-start mb-3 pb-2 border-b border-slate-700">
                <div>
                  <span class="text-lg font-black ${isSeen ? 'text-slate-400' : 'text-amber-400'} block">
                    ${escapeHtml(order.table)}
                  </span>
                  <span class="text-xs text-slate-400 flex items-center gap-1">
                    <i class="fa-regular fa-clock"></i> ${timeStr}
                  </span>
                </div>
                <div>
                  ${isSeen 
                    ? `<span class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2.5 py-1 rounded-full border border-emerald-500/30 flex items-center gap-1"><i class="fa-solid fa-check"></i> Erledigt</span>`
                    : `<span class="bg-rose-500/20 text-rose-400 text-xs font-bold px-2.5 py-1 rounded-full border border-rose-500/30 animate-pulse">NEU</span>`
                  }
                </div>
              </div>

              <!-- Items List -->
              <div class="space-y-2 mb-4">
                ${order.items.map(item => `
                  <div class="flex justify-between items-center bg-slate-900/80 px-3 py-2 rounded-xl border border-slate-800">
                    <span class="text-sm font-semibold text-slate-100">${escapeHtml(item.name)}</span>
                    <span class="text-base font-black text-amber-400 bg-slate-800 px-2.5 py-0.5 rounded-lg border border-slate-700">${item.qty}x</span>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Action Button -->
            <button onclick="toggleOrderSeen('${order.id}')" 
                    class="w-full py-3.5 px-4 rounded-xl font-bold text-sm transition-all flex items-center justify-center space-x-2 shadow-lg ${
                      isSeen 
                        ? 'bg-slate-700 hover:bg-slate-600 text-slate-300' 
                        : 'bg-emerald-600 hover:bg-emerald-500 text-white active:scale-95'
                    }">
              <i class="fa-solid ${isSeen ? 'fa-rotate-left' : 'fa-check'} text-base"></i>
              <span>${isSeen ? 'Als Offen markieren' : 'Erledigt'}</span>
            </button>
          </div>
        `;
      }).join('');
    }

    function renderSpeisesaalHistory() {
      const container = document.getElementById('speisesaal-history');
      if (orders.length === 0) {
        container.innerHTML = '<p class="text-slate-500 italic">Noch keine Bestellungen aufgegeben.</p>';
        return;
      }

      container.innerHTML = orders.slice(0, 5).map(order => {
        const timeStr = new Date(order.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const totalItems = order.items.reduce((sum, i) => sum + i.qty, 0);

        return `
          <div class="bg-slate-900/90 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center">
            <div>
              <div class="font-bold text-slate-200">${escapeHtml(order.table)} <span class="text-slate-500 font-normal">(${totalItems} Artikel)</span></div>
              <div class="text-[10px] text-slate-400">${timeStr} Uhr</div>
            </div>
            <div>
              ${order.seen 
                ? `<span class="text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-lg text-[11px] font-bold flex items-center gap-1"><i class="fa-solid fa-check"></i> Erledigt</span>`
                : `<span class="text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded-lg text-[11px] font-bold flex items-center gap-1"><i class="fa-solid fa-hourglass-half animate-spin"></i> In Bearbeitung</span>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    // --- Helpers ---
    function showToast(message, iconClass = 'fa-circle-check') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.innerText = message;
      toastIcon.className = `fa-solid ${iconClass} text-xl`;

      toast.classList.remove('translate-y-24', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-24', 'opacity-0');
      }, 3000);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // App Initialization
    window.onload = function() {
      loadOrdersFromStorage();
      renderMenuForm();
      updateOrderSummary();
    };
  </script>
</body>
</html>
